<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mail · CaffnCode</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📬%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/mail-ui.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --cream:#fdf6f0;--espresso:#2c1a0e;--caramel:#c87941;
      --latte:#e8c9a0;--foam:#f5ede3;--steam:#d4a574;
      --dark-roast:#1a0f07;--mocha:#6b3d1e;
      --green:#2d6a4f;--green-lt:#d8f3dc;
      --red:#8b1a1a;--red-lt:#fde8e8;
    }
    html,body{height:100%}
    body{background:var(--cream);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;color:var(--espresso);min-height:100vh}
    body::before{
      content:'';position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(44,26,14,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(44,26,14,0.04) 1px, transparent 1px);
      background-size:24px 24px;pointer-events:none;z-index:0;
    }

    /* NAV */
    nav{
      position:sticky;top:0;z-index:200;background:var(--espresso);border-bottom:3px solid var(--caramel);
      padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;
    }
    .nav-icon{display:inline-block;flex-shrink:0;vertical-align:middle;box-shadow:2px 2px 0 rgba(255,255,255,0.2)}
    .nav-logo{font-family:'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:900;font-size:1.05rem;letter-spacing:-0.04em;color:var(--cream);display:flex;align-items:center;gap:8px}
    .nav-badge{font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;background:var(--caramel);color:var(--espresso);padding:2px 8px;box-shadow:2px 2px 0 rgba(0,0,0,0.2);font-weight:700}
    .nav-right{display:flex;align-items:center;gap:12px}
    .nav-user{font-size:0.68rem;color:var(--steam);letter-spacing:0.05em}
    .nav-user strong{color:var(--caramel)}
    .nav-link{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--latte);text-decoration:none;border:1.5px solid rgba(255,255,255,0.2);padding:5px 10px;transition:all .15s}
    .nav-link:hover{border-color:var(--caramel);color:var(--caramel)}
    .btn-logout{background:transparent;border:1.5px solid rgba(255,255,255,0.2);color:var(--steam);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;padding:5px 10px;cursor:pointer;transition:all 0.15s}
    .btn-logout:hover{border-color:var(--caramel);color:var(--caramel)}
    @media(max-width:700px){
      nav{padding:0 1rem}
      .nav-user,.nav-link{display:none}
      #login-screen{justify-content:center}
      .login-wrap{justify-content:center;width:100%;padding:1.5rem}
    }

    .mail-wrap{position:relative;z-index:1;height:calc(100vh - 56px);padding:1.2rem}
    @media(max-width:700px){.mail-wrap{padding:.5rem}}

    /* LOGIN */
    #login-screen{
      min-height:100vh;display:flex;
      background:var(--cream);position:relative;z-index:1;
    }
    .login-wrap{
      min-height:100vh;display:flex;align-items:center;justify-content:flex-start;
      position:relative;z-index:1;padding:2.5rem clamp(2rem, 8vw, 6rem);
    }
    .login-card{background:var(--foam);border:2px solid var(--espresso);padding:2.5rem;width:100%;max-width:400px;box-shadow:8px 8px 0 var(--caramel);position:relative}
    .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--caramel) 0,var(--caramel) 6px,var(--espresso) 6px,var(--espresso) 9px)}
    .login-logo{font-family:'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:900;font-size:1.4rem;letter-spacing:-0.04em;margin-bottom:0.2rem;display:flex;align-items:center;gap:8px}
    .login-logo .pixel{width:10px;height:10px;background:var(--caramel);box-shadow:3px 3px 0 var(--espresso);display:inline-block}
    .login-sub{font-size:0.68rem;color:var(--mocha);margin-bottom:2rem}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
    .field label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--mocha);font-weight:700}
    .field input{border:2px solid var(--espresso);background:var(--cream);padding:9px 12px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:0.78rem;color:var(--espresso);outline:none;transition:border-color 0.15s}
    .field input:focus{border-color:var(--caramel)}
    .btn-primary{background:var(--espresso);color:var(--cream);border:none;padding:10px 20px;font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;box-shadow:4px 4px 0 var(--caramel);cursor:pointer;transition:all 0.12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:1rem}
    .btn-primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--caramel)}
    .btn-primary:disabled{opacity:0.5;transform:none;box-shadow:none;cursor:not-allowed}
    .error-box{background:var(--red-lt);border:2px solid var(--red);padding:10px 14px;font-size:0.72rem;color:var(--red);margin-bottom:1rem;display:none}
    .error-box.show{display:block}
    .login-foot{font-size:0.6rem;color:var(--steam);margin-top:1.2rem;line-height:1.7}
    .login-foot a{color:var(--caramel)}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(253,246,240,0.3);border-top-color:var(--cream);border-radius:50%;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><span class="pixel"></span> caffncode <span class="nav-badge" style="font-size:0.55rem;padding:2px 7px;letter-spacing:0.12em;vertical-align:middle;box-shadow:2px 2px 0 rgba(0,0,0,0.15)">MAIL</span></div>
      <div class="login-sub">Webmail · sign in to continue</div>

      <form onsubmit="login(event)">
        <div class="field">
          <label for="login-username">Email or Username</label>
          <input type="text" id="login-username" placeholder="email or username" autocomplete="username" required/>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <div id="login-error" class="error-box"></div>
        <button class="btn-primary" id="login-btn" type="submit">Sign in ↗</button>
      </form>
      <div class="login-foot">Sign in with your @caffncode.com account. Need an account or password reset? Visit <a href="https://admin.caffncode.com" target="_blank" rel="noopener">admin.caffncode.com</a>.</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="mail-app" style="display:none">
  <nav>
    <div class="nav-logo">
      <svg class="nav-icon" width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="28" height="28" fill="#c87941"/>
        <rect x="2" y="2" width="24" height="24" fill="#fdf6f0"/>
        <rect x="7" y="12" width="11" height="9" fill="#c87941"/>
        <rect x="8" y="13" width="9" height="7" fill="#2c1a0e"/>
        <rect x="8" y="13" width="9" height="2.5" fill="#4a2c14" opacity="0.5"/>
        <rect x="18" y="14" width="2.5" height="4" rx="0.5" fill="#c87941"/>
        <rect x="6" y="21" width="13" height="1.5" fill="#c87941"/>
        <rect x="5" y="22.5" width="15" height="1.5" fill="#a06030"/>
        <rect x="10" y="8" width="1" height="4" fill="#c87941" opacity="0.5"/>
        <rect x="13.5" y="6.5" width="1" height="5" fill="#c87941" opacity="0.5"/>
        <rect x="17" y="8" width="1" height="4" fill="#c87941" opacity="0.5"/>
      </svg>
      caffncode
      <span class="nav-badge">mail</span>
    </div>
    <div class="nav-right">
      <span class="nav-user">Signed in as <strong id="nav-username">-</strong></span>
      <a class="nav-link" href="https://admin.caffncode.com">Admin ↗</a>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </nav>
  <div class="mail-wrap"><div id="mail-root" style="height:100%"></div></div>
</div>

<script>
  const SUPABASE_URL = 'https://qjcnqslvoseyaabjjvkn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_01TSfCXJMwGFVt2PxJQvSA_n8eL2zn7';
  const AUTH_STORAGE_KEY = 'sb-qjcnqslvoseyaabjjvkn-auth-token';

  // Shared .caffncode.com cookie + localStorage storage so admin & email share one SSO session without rotating each other's refresh tokens
  const sharedAuthStorage = (() => {
    const isCaffnCode = /(^|\.)caffncode\.com$/i.test(location.hostname);
    const CHUNK_SIZE = 2800;
    function readCookieMap() {
      const map = {};
      (document.cookie || '').split(';').forEach(pair => {
        const idx = pair.indexOf('=');
        if (idx > 0) map[pair.slice(0, idx).trim()] = pair.slice(idx + 1).trim();
      });
      return map;
    }
    function setCookie(name, val, maxAge) {
      const domainAttr = isCaffnCode ? '; Domain=.caffncode.com' : '';
      const secureAttr = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = `${name}=${val}; Path=/${domainAttr}; Max-Age=${maxAge}; SameSite=Lax${secureAttr}`;
    }
    return {
      getItem(key) {
        if (isCaffnCode) {
          const map = readCookieMap();
          if (map[`${key}.0`] !== undefined) {
            let combined = '';
            for (let i = 0; map[`${key}.${i}`] !== undefined; i++) combined += map[`${key}.${i}`];
            try { return decodeURIComponent(combined); } catch {}
          } else if (map[key] !== undefined) {
            try { return decodeURIComponent(map[key]); } catch {}
          }
        }
        try { return localStorage.getItem(key); } catch { return null; }
      },
      setItem(key, value) {
        try { localStorage.setItem(key, value); } catch {}
        if (isCaffnCode) {
          const enc = encodeURIComponent(value);
          const chunks = Math.ceil(enc.length / CHUNK_SIZE) || 1;
          for (let i = 0; i < chunks; i++) {
            setCookie(`${key}.${i}`, enc.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE), 31536000);
          }
          const map = readCookieMap();
          for (let i = chunks; map[`${key}.${i}`] !== undefined; i++) {
            setCookie(`${key}.${i}`, '', 0);
          }
        }
      },
      removeItem(key) {
        try { localStorage.removeItem(key); } catch {}
        if (isCaffnCode) {
          setCookie(key, '', 0);
          const map = readCookieMap();
          for (let i = 0; map[`${key}.${i}`] !== undefined || i < 6; i++) {
            setCookie(`${key}.${i}`, '', 0);
          }
        }
      },
    };
  })();

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storageKey: AUTH_STORAGE_KEY,
      storage: sharedAuthStorage,
      detectSessionInUrl: false,
    },
  });
  let mailApp = null;
  let handlingExpired = false;

  async function getToken(forceRefresh = false) {
    const nowSec = Math.floor(Date.now() / 1000);
    let { data: { session } } = await sb.auth.getSession();
    const isExpiring = session?.expires_at && (session.expires_at - nowSec < 60);

    // Check if another .caffncode.com tab already rotated & saved a fresher token in the shared cookie
    if (forceRefresh || !session?.access_token || isExpiring) {
      try {
        const raw = sharedAuthStorage.getItem(AUTH_STORAGE_KEY);
        const stored = raw ? JSON.parse(raw) : null;
        if (stored?.access_token && stored?.expires_at > nowSec + 60 && stored.access_token !== session?.access_token) {
          return stored.access_token;
        }
      } catch {}

      const { data, error } = await sb.auth.refreshSession();
      if (!error && data?.session) {
        session = data.session;
      } else if (forceRefresh || isExpiring) {
        return '';
      }
    }
    return session?.access_token || '';
  }

  async function handleSessionExpired() {
    if (handlingExpired) return;
    handlingExpired = true;
    try { await sb.auth.signOut({ scope: 'local' }); } catch {}
    sharedAuthStorage.removeItem(AUTH_STORAGE_KEY);
    showLogin('Your session expired. Please sign in again.');
    handlingExpired = false;
  }

  function showLogin(msg = '') {
    document.title = 'Mail · CaffnCode';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('mail-app').style.display = 'none';
    if (mailApp) { mailApp.destroy(); mailApp = null; }
    const err = document.getElementById('login-error');
    if (msg && err) {
      err.textContent = '⚠ ' + msg;
      err.classList.add('show');
    }
  }

  async function showApp(session) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('mail-app').style.display = 'block';
    let name = session.user.email;
    try {
      const { data } = await sb.from('profiles').select('display_name,username').eq('id', session.user.id).maybeSingle();
      name = data?.display_name || data?.username || name;
    } catch {}
    document.getElementById('nav-username').textContent = name;
    if (!mailApp) {
      mailApp = CaffnMail.mount(document.getElementById('mail-root'), {
        apiBase: '',
        getToken,
        onUnauthorized: handleSessionExpired,
        onUnreadChange(count) {
          document.title = count > 0 ? `(${count}) Mail · CaffnCode` : 'Mail · CaffnCode';
        },
      });
    }
  }

  async function login(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    err.classList.remove('show');
    let email = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email.includes('@')) email = `${email}@caffncode.com`;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await showApp(data.session);
    } catch (ex) {
      err.textContent = '⚠ ' + (ex.message || 'Login failed');
      err.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sign in ↗';
    }
  }

  async function logout() {
    await sb.auth.signOut();
    showLogin();
  }

  window.addEventListener('load', async () => {
    // Check if session was passed via URL hash (seamless SSO from admin portal)
    if (window.location.hash) {
      const hash = window.location.hash.replace(/^#/, '');
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');
      if (access_token && refresh_token) {
        try {
          const { data, error } = await sb.auth.setSession({ access_token, refresh_token });
          if (!error && data?.session) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
            await showApp(data.session);
            return;
          }
        } catch (e) {
          console.warn('SSO hash auth error:', e);
        }
      }
    }

    const token = await getToken();
    if (token) {
      const { data: { session } } = await sb.auth.getSession();
      if (session) await showApp(session);
      else await handleSessionExpired();
    } else {
      const { data: { session: stale } } = await sb.auth.getSession();
      if (stale) await handleSessionExpired();
      else showLogin();
    }
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') showLogin();
      else if (session && !mailApp) showApp(session);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && mailApp) getToken().catch(() => {});
    });
  });
</script>
</body>
</html>
